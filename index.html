<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTMPS Infinite Linked Banner Slider System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Outer slider viewport box */
        .ltmps-slider-viewport {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 1000 / 395; /* Exact layout ratio from the school site */
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background-color: #ffffff;
            border-radius: 4px;
        }

        /* Flex sliding rail */
        .ltmps-slider-rail {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Individual slide panels */
        .ltmps-slide-panel {
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            position: relative;
        }

        /* Clickable image link wrappers */
        .ltmps-slide-panel a {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            cursor: pointer;
        }

        .ltmps-slide-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Precise bottom teal caption overlay bar */
        .ltmps-caption-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 46px;
            background-color: rgba(4, 67, 67, 0.85); /* Dark semi-transparent teal */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            z-index: 5;
            pointer-events: none;
        }

        /* Navigation Arrows on Left and Right sides */
        .ltmps-arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.45);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: background-color 0.2s, transform 0.2s;
            color: #333333;
            font-weight: bold;
            font-size: 16px;
        }

        .ltmps-arrow-btn:hover {
            background-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-50%) scale(1.05);
        }

        .arrow-left { left: 15px; }
        .arrow-right { right: 15px; }

        /* Indicator Pagination Dots Panel inside the teal bar */
        .ltmps-indicator-panel {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .ltmps-dot-marker {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .ltmps-dot-marker.is-active {
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <script>
        const viewport = document.getElementById('sliderViewport');
        const rail = document.getElementById('sliderRail');
        const originalSlides = document.querySelectorAll('.ltmps-slide-panel');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const dotsContainer = document.getElementById('dotsContainer');

        let currentIndex = 0;
        const totalOriginalSlides = originalSlides.length;
        let slideInterval;
        const slideDuration = 4000; // Slide holds for 4 seconds

        // 1. Create Seamless Loop Clone (Clone the first slide and add to the absolute end)
        const firstSlideClone = originalSlides[0].cloneNode(true);
        rail.appendChild(firstSlideClone);

        // 2. Generate Interactive Pagination Dots dynamically based on count
        for (let i = 0; i < totalOriginalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('ltmps-dot-marker');
            if (i === 0) dot.classList.add('is-active');
            dot.addEventListener('click', () => jumpToSlide(i));
            dotsContainer.appendChild(dot);
        }
        const dots = document.querySelectorAll('.ltmps-dot-marker');

        // 3. Movement Engine Function
        function updateSliderPosition(withTransition = true) {
            if (withTransition) {
                rail.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
            } else {
                rail.style.transition = 'none';
            }
            rail.style.transform = `translateX(-${currentIndex * 100}%)`;
            updateDots();
        }

        function updateDots() {
            dots.forEach((dot, index) => {
                const visualIndex = currentIndex === totalOriginalSlides ? 0 : currentIndex;
                if (index === visualIndex) {
                    dot.classList.add('is-active');
                } else {
                    dot.classList.remove('is-active');
                }
            });
        }

        function nextSlide() {
            currentIndex++;
            updateSliderPosition(true);

            if (currentIndex === totalOriginalSlides) {
                setTimeout(() => {
                    currentIndex = 0;
                    updateSliderPosition(false); 
                }, 600); 
            }
        }

        function prevSlide() {
            if (currentIndex === 0) {
                currentIndex = totalOriginalSlides;
                updateSliderPosition(false);
                setTimeout(() => {
                    currentIndex = totalOriginalSlides - 1;
                    updateSliderPosition(true);
                }, 20);
            } else {
                currentIndex--;
                updateSliderPosition(true);
            }
        }

        function jumpToSlide(index) {
            currentIndex = index;
            updateSliderPosition(true);
            resetAutoplay();
