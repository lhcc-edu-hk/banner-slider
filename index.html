<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Scrolling Picture System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        /* The container that crops the overflowing images */
        .scroll-container {
            overflow: hidden;
            width: 100%;
            max-width: 1200px;
            padding: 20px 0;
            background: #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Gradient overlays to fade out the edges */
        .scroll-container::before,
        .scroll-container::after {
            content: "";
            height: 100%;
            position: absolute;
            top: 0;
            width: 150px;
            z-index: 2;
            pointer-events: none;
        }
        .scroll-container::before {
            left: 0;
            background: linear-gradient(to right, #222, transparent);
        }
        .scroll-container::after {
            right: 0;
            background: linear-gradient(to left, #222, transparent);
        }

        /* The track moving left horizontally */
        .scroll-track {
            display: flex;
            width: calc(250px * 12); /* Width of 1 image * total number of images (including duplicates) */
            animation: scroll 20s linear infinite;
        }

        /* Pause animation on mouse hover */
        .scroll-track:hover {
            animation-play-state: paused;
        }

        /* Individual image wrapper */
        .image-box {
            width: 250px;
            height: 200px;
            padding: 10px;
            flex-shrink: 0;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        /* Subtle scale effect on hover */
        .image-box img:hover {
            transform: scale(1.05);
            cursor: pointer;
        }

        /* Animation Keyframes: translate by exactly half the track width (the original set of 6 images) */
        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(calc(-250px * 6));
            }
        }
    </style>
</head>
<body>

    <div class="scroll-container">
        <div class="scroll-track">
            
            <!-- ORIGINAL SET OF IMAGES (6 Images) -->
            <div class="image-box">
                <img src="https://picsum.photos" alt="Picture 1">
            </div>
            <div class="image-box">
                <img src="https://picsum.photos" alt="Picture 2">
            </div>
            <div class="image-box">
                <img src="https://picsum.photos" alt="Picture 3">
            </div>
            <div class="image-box">
                <img src="https://picsum.photos" alt="Picture 4">
            </div>
            <div class="image-box">
                <img src="https://picsum.photos" alt="Picture 5">
            </div>
            <div class="image-box">
                <img src="https://picsum.photos" alt="Picture 6">
            </div>

            <!-- DUPLICATED SET (Required to create the seamless infinite loop effect) -->
            <div class="image-box">
                <img src="https://picsum.photos" alt="Picture 1 Copy">
            </div>
            <div class="image-box">
                <img src="https://picsum.photos" alt="Picture 2 Copy">
            </div>
            <div class="image-box">
                <img src="https://picsum.photos" alt="Picture 3 Copy">
            </div>
            <div class="image-box">
                <img src="https://picsum.photos" alt="Picture 4 Copy">
            </div>
            <div class="image-box">
                <img src="https://picsum.photos" alt="Picture 5 Copy">
            </div>
            <div class="image-box">
                <img src="https://picsum.photos" alt="Picture 6 Copy">
            </div>

        </div>
    </div>

</body>
</html>
